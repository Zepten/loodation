name: loodation

volumes:
  db-data:
  redis-data:

networks:
  loodation-network:
    name: loodation-network

services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB__NAME:?error}
      - POSTGRES_USER=${DB__USERNAME:?error}
      - POSTGRES_PASSWORD=${DB__PASSWORD:?error}
    ports:
      - "127.0.0.1:${DB__PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - loodation-network

  redis:
    image: redis:8.6-alpine
    env_file:
      - .env
    ports:
      - "127.0.0.1:${REDIS__PORT}:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS__PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - loodation-network

  api:
    build:
      context: ./loodation-api
      dockerfile: ./docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API__PORT}:8000"
      - "127.0.0.1:${API__DEBUG_PORT}:8001"
    volumes:
      - ./loodation-api:/app:Z
    command:
      - python
      - -Xfrozen_modules=off
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:8001
      - --configure-subProcess
      - "true"
      - -m
      - uvicorn
      - loodation.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - loodation-network